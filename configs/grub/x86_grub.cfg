set timeout=20
set default=0

menuentry "GoOS" {
    	linux /boot/vmlinuz rw rdinit=/boot/init 
    	initrd /boot/initramfs.img
}

menuentry "GoOS Serial Debug" {
    	serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
	terminal_input serial console
	terminal_output serial console
	
    	linux /boot/vmlinuz rw rdinit=/boot/init console=ttyS0,11520
    	initrd /boot/initramfs.img
}
